<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Attendly — Campus Services</title><link rel="stylesheet" href="./styles.css?v=attendly-ui-20261029-03"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main style="max-width:1100px;margin:24px auto;padding:16px">
<header style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><p class="eyebrow">ATTENDLY CAMPUS</p><h1>Campus Services</h1><p>Leave requests, timetable, announcements and notifications</p></div><div><span id="who">Checking session…</span> <button id="signout" class="button button-outline">Sign out</button></div></header>
<section id="auth" class="panel hidden" style="padding:24px;border:1px solid #e7ebf2;border-radius:16px;background:#fff;box-shadow:0 14px 38px rgba(31,48,82,.055)"><h2 style="font-size:20px;margin:0 0 18px">Sign in</h2><form id="login" style="display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin:0"><label style="display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700;color:#38445a">Email<input id="email" type="email" required autocomplete="email" style="display:block;width:100%;box-sizing:border-box;min-height:44px;padding:11px 13px;border:1px solid #dfe5ef;border-radius:10px;background:#fff;color:#1e293b;font:inherit"></label><label style="display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700;color:#38445a">Password<input id="password" type="password" required autocomplete="current-password" style="display:block;width:100%;box-sizing:border-box;min-height:44px;padding:11px 13px;border:1px solid #dfe5ef;border-radius:10px;background:#fff;color:#1e293b;font:inherit"></label><button class="button button-primary" style="width:100%;min-height:44px">Sign in</button></form></section>
<div id="message" role="status" style="margin:12px 0"></div>
<section id="campus" class="hidden">
<nav style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0"><button class="button button-outline" data-tab="leave">Leave</button><button class="button button-outline" data-tab="timetable">Timetable</button><button class="button button-outline" data-tab="announcements">Announcements</button><button class="button button-outline" data-tab="notifications">Notifications</button><button class="button button-outline" id="certificate-tab" data-tab="certificates">Certificate Requests</button></nav>
<section id="content" class="panel"></section>
</section></main><script src="./campus.js?v=campus-role-label-20261029-01"></script></body></html>
