<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Attendly ERP</title><link rel="stylesheet" href="./styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
.erp-shell{max-width:1400px;margin:0 auto;padding:22px}.erp-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.erp-head h1{margin:0}.erp-muted{color:#64748b;font-size:13px}.erp-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.erp-tabs button{border:1px solid #dbe2ed;border-radius:10px;padding:10px 13px;background:#fff;font-weight:650;color:#334155}.erp-tabs button.active{background:#4659e8;color:white;border-color:#4659e8}.erp-card{background:#fff;border:1px solid #e4eaf2;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #0f172a08}.erp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.erp-grid label{display:block;font-size:12px;color:#475569;font-weight:650}.erp-grid input,.erp-grid select,.erp-grid textarea{box-sizing:border-box;width:100%;margin-top:5px;border:1px solid #dbe2ed;border-radius:9px;padding:10px;background:white;font:inherit}.erp-grid textarea{min-height:75px}.erp-btn{border:0;border-radius:9px;padding:10px 14px;background:#4659e8;color:white;font-weight:700}.erp-btn.secondary{background:#eef2ff;color:#3547cb}.erp-status{padding:10px 12px;border-radius:10px;background:#f1f5f9;margin:10px 0;font-size:13px}.erp-table{width:100%;border-collapse:collapse;min-width:720px}.erp-table th,.erp-table td{padding:11px;border-bottom:1px solid #e8edf4;text-align:left;font-size:13px}.erp-table th{color:#64748b;font-size:11px;text-transform:uppercase}.erp-overflow{overflow:auto}.erp-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.erp-stat{padding:18px;border-radius:14px;background:white;border:1px solid #e4eaf2}.erp-stat b{display:block;font-size:25px;margin-top:6px}.hidden{display:none!important}@media(max-width:760px){.erp-shell{padding:12px}.erp-grid{grid-template-columns:1fr}.erp-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body style="background:#f4f7fb">
<main class="erp-shell"><header class="erp-head"><div><a href="./index.html">← Back to Attendly</a><h1 style="margin-top:12px">Institution ERP</h1><p class="erp-muted">Role-aware modules for admissions, staff, exams, finance, library and hostel.</p></div><div><span id="erp-user" class="erp-muted">Checking session…</span> <button id="erp-signout" class="erp-btn secondary">Sign out</button></div></header>
<div id="erp-status" class="erp-status" role="status">Connecting to Attendly…</div><section id="erp-app" class="hidden"><div id="erp-cards" class="erp-cards"></div><nav id="erp-tabs" class="erp-tabs"></nav><section class="erp-card"><div class="erp-head"><div><h2 id="erp-title">Overview</h2><p id="erp-desc" class="erp-muted">Your role-based workspace</p></div><button id="erp-refresh" class="erp-btn secondary">Refresh</button></div><div id="erp-form-wrap"></div><div id="erp-table-wrap" class="erp-overflow"></div></section></section></main>
<script src="./erp.js?v=1"></script></body></html>
