name: Deploy Attendly to GitHub Pages

# Manual-only duplicate workflow. Automatic deployment is handled by deploy-pages.yml
# to avoid two workflows competing for the same GitHub Pages environment.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Check JavaScript syntax and required site files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f campus.html
          test -f campus.js
          test -f college.html
          test -f college.js
          node --check app.js
          node --check campus.js
          node --check college.js
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
